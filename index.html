<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>
<body>
    <center>
        <h1>PaintPro</h1>
        <br>
        <div  id="box" contenteditable="true" >
        </div>
        <button id="dwb">download</button>
        <div id="row">
            <div class="rowbox">
                <h2>backgroundColors</h2>
                <button onclick="changeBackgroundColor('red')" class="btn" style="background-color: red;"></button>
                <button onclick="changeBackgroundColor('green')" class="btn" style="background-color: green;"></button>
                <button onclick="changeBackgroundColor('yellow')" class="btn" style="background-color: yellow;"></button>
                <button onclick="changeBackgroundColor('orange')" class="btn" style="background-color: orange;"></button>
               <button onclick="changeBackgroundColor('hotpink')" class="btn" style="background-color: hotpink;"></button>
               <button onclick="changeBackgroundColor('white')" class="btn" style="background-color: white;"></button> 
               <button onclick="changeBackgroundColor('magenta')" class="btn" style="background-color: magenta;"></button>
               <button onclick="changeBackgroundColor('orange')" class="btn" style="background-color:orange;"></button>
               <button onclick="changeBackgroundColor('blue')" class="btn" style="background-color: blue;"></button>
            </div>
            <div class="rowbox">
                <h2>colors</h2>
                <button onclick="changeColor('violet')" class="btn" style="background-color: violet;"></button>
                <button onclick="changeColor('indigo')" class="btn" style="background-color: indigo;"></button>
                <button onclick="changeColor('blue')" class="btn" style="background-color: blue;"></button>
                <button onclick="changeColor('green')" class="btn" style="background-color: green;"></button>
                <button onclick="changeColor('yellow')" class="btn" style="background-color: yellow;"></button>
                <button onclick="changeColor('orange')" class="btn" style="background-color: orange;"></button>
                <button onclick="changeColor('red')" class="btn" style="background-color:   red;"></button>
                <button onclick="changeColor('black')" class="btn" style="background-color: black;"></button>
                <button onclick="changeColor('white')" class="btn" style="background-color: white;"></button>
               </div> 
                
            <div class="rowbox">
              <h2>fonts</h2> 
              <button onclick="changeFont('Italic')" class="btn" style="font-family: Arial;">Hi</button>
              <button onclick="changeFont('Cursive')" class="btn" style="font-family: Cursive;">Hi</button>  
              <button onclick="changeFont('Arial')" class="btn" style="font-family: Arial;">Hi</button>
              <button onclick="changeFont('Courier New')" class="btn" style="font-family: Courier New;">Hi</button>
              <button onclick="changeFont('Verdana')" class="btn" style="font-family: Verdana;">Hi</button>
              <button onclick="changeFont('Times New Roman')" class="btn" style="font-family: Times New Roman;">Hi</button> 
            </div>
        </div>
        
    </center>



</body>
</html>
